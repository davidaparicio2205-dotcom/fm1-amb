# HALF-LIGHT's build settings (fm1-base's tools/build.py: ./build.sh). A fork of AMB-1 (Charles Vestal) with its own
# identity, so the two never collide on a device or a firmware hub.
name = "HALFLIGHT"             # the build's files: halflight.fwsc, halflight-X.Y.fwsc
id_prefix = "FM-1_84"          # package identity: dev FM-1_8400, releases FM-1_84XXYYZZ (AMB-1 is FM-1_7)
usb_manufacturer = "HALF-LIGHT"
usb_product = "HALF-LIGHT FM-1"
ble = false                    # never uses the radio
usb_audio_in = true            # the music recordable over USB
usb_audio_out = false
words = "words.tsv"
include = ["dsp"]
o2 = ["dsp/amb.c"]             # the engine, at -O2
# the site
tagline = "Four eras of night music for the FM-1"
repo = "https://github.com/davidaparicio2205-dotcom/fm1-amb"
licence = "MPL-2.0"
credits = "A fork of AMB-1 by Charles Vestal. Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."

# firmware.json, for firmware hubs (fm1-base docs/FIRMWARE-JSON.md)
author = "David (davidaparicio2205-dotcom), after Charles Vestal's AMB-1"
description = "HALF-LIGHT is a generative ambient machine for the M-VAVE FM-1 in four eras, two pieces each: after dark (monochrome, intimate, a phased and chorused pad), the long glow (big pads, soft piano, neon haze), clean signal (a formant choir that turns mechanical, glitching bells) and cut and paste (fragments, two-step pulses, cold electronics). It plays itself from the moment it is switched on, and every era has its own moving screen that follows the sound. Built on Charles Vestal's AMB-1."
tags = ["ambient", "generative", "fm"]
install = "https://github.com/davidaparicio2205-dotcom/fm1-amb/releases"
site = "https://github.com/davidaparicio2205-dotcom/fm1-amb"
screenshot = "docs/visuals/era1-after-dark.png"
